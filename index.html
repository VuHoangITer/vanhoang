// ---------- Căn avatar thẳng hàng với thẻ Discord bên dưới (chỉ trên máy tính) ----------
function alignAvatar() {
  const box = $("avatar-box"), pres = $("presence");
  box.style.translate = "";
  if (innerWidth < 761 || !pres) return;
  const prof = $("profile"), saved = prof.style.transform;
  prof.style.transform = "";                                  // bỏ độ nghiêng 3D khi đo cho chính xác
  const a = box.getBoundingClientRect(), p = pres.getBoundingClientRect();
  prof.style.transform = saved;
  box.style.translate = `${Math.round((p.left + p.width / 2) - (a.left + a.width / 2))}px 0`;
}
addEventListener("resize", alignAvatar);

// ---------- Mèo 2D trong thẻ hồ sơ: nhà mèo, cột cào móng, ổ nằm, bát ăn, cuộn len, chuột đồ chơi ----------
(function catsInCard() {
  if (!P.cats || !P.cats.length) return;
  const prof = $("profile");
  const cv = document.createElement("canvas");
  cv.className = "cat-layer"; prof.appendChild(cv);
  const g = cv.getContext("2d");
  let W = 0, H = 0, dpr = 1, floor = 0, items = {};

  function layout() {
    const r = prof.getBoundingClientRect();
    dpr = LITE ? 1.25 : Math.min(devicePixelRatio || 1, 2);
    W = prof.offsetWidth; H = prof.offsetHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    floor = H - 10;
    const narrow = W < 500;
    items = {
      house: { x: 22, w: 50, h: 38 },
      post:  { x: narrow ? 92 : 104 },
      bowl:  { x: W - (narrow ? 112 : 150) },
      bed:   { x: W - (narrow ? 48 : 64), rx: narrow ? 26 : 32 },
    };
  }
  layout();
  new ResizeObserver(layout).observe(prof);

  const ball = { x: 0, vx: 0, rot: 0 }, mouse = { x: 0 };
  ball.x = W * .45; mouse.x = W * .62;

  // ---- Mèo ----
  const cats = P.cats.map((c, i) => ({
    ...c, x: 120 + i * 90, dir: i % 2 ? -1 : 1, state: "walk", tx: rand(80, W - 80),
    timer: 0, phase: rand(0, 6), seed: rand(0, 6), speed: rand(.55, .8), size: c.size || 1, jy: 0, vy: 0, taps: [],
  }));

  function choose(c) {
    const r = Math.random();
    c.next = null;
    if (r < .26) go(c, rand(70, W - 70), "sit");
    else if (r < .42) go(c, items.bed.x + rand(-6, 6), "sleep");
    else if (r < .56) go(c, items.post.x - 14, "scratch");
    else if (r < .68) go(c, items.house.x + items.house.w / 2, "hide");
    else if (r < .80) go(c, items.bowl.x - 16, "eat");
    else { c.state = "chase"; c.timer = rand(5000, 9000); }
  }
  function go(c, x, next) { c.state = "walk"; c.tx = Math.max(20, Math.min(W - 20, x)); c.next = next; }
  function settle(c) {
    const s = c.next || "sit";
    c.state = s;
    c.timer = { sit: rand(2500, 5000), sleep: rand(7000, 12000), scratch: rand(2500, 4000), hide: rand(3000, 6000), eat: rand(2500, 4000) }[s] || 3000;
    if (s === "scratch") c.dir = 1;
    if (s === "eat") c.dir = 1;
  }

  // ---- Vẽ mèo nhìn ngang (hướng phải), dir = -1 thì lật ---------
  function drawCat(c, t) {
    if (c.state === "hide") return;
    const s = c.size;
    g.save(); g.translate(c.x, floor - c.jy); g.scale(c.dir * s, s);
    g.lineJoin = g.lineCap = "round";
    const col = c.color, dk = c.dark, ol = "rgba(0,0,0,.45)";
    g.lineWidth = 1.1; g.strokeStyle = ol;

    const ear = (x, y, flip) => { g.beginPath(); g.moveTo(x - 3, y + 2); g.lineTo(x + (flip ? 1 : 0), y - 6); g.lineTo(x + 4, y + 1); g.closePath(); g.fill(); g.stroke(); };
    const head = (hx, hy, closed) => {
      g.fillStyle = col; ear(hx - 3, hy - 4, false); ear(hx + 3, hy - 4, true);
      g.beginPath(); g.arc(hx, hy, 6.5, 0, 7); g.fill(); g.stroke();
      if (c.patch) { g.fillStyle = c.patch; g.beginPath(); g.arc(hx + 1.5, hy + 2.5, 3.4, 0, 7); g.fill(); }
      g.fillStyle = "#1b1b1b"; g.strokeStyle = "#1b1b1b";
      if (closed) { g.lineWidth = 1; g.beginPath(); g.moveTo(hx + 1, hy - 1); g.quadraticCurveTo(hx + 2.5, hy, hx + 4, hy - 1); g.stroke(); }
      else { g.beginPath(); g.ellipse(hx + 2.6, hy - 1, 1.1, 1.6, 0, 0, 7); g.fill(); g.fillStyle = "#fff"; g.fillRect(hx + 2.7, hy - 2, .7, .7); }
      g.fillStyle = "#f08aa0"; g.beginPath(); g.arc(hx + 6.2, hy + 1, 1, 0, 7); g.fill();
      g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = .5;
      g.beginPath(); g.moveTo(hx + 5, hy + 2); g.lineTo(hx + 10, hy + 1); g.moveTo(hx + 5, hy + 2.6); g.lineTo(hx + 10, hy + 3.2); g.stroke();
      g.strokeStyle = ol; g.lineWidth = 1.1;
    };
    const tail = (x, y, up, wag) => {
      g.strokeStyle = col; g.lineWidth = 3.2;
      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x - 10, y - 2 + wag, x - 9, y - up + wag); g.stroke();
      g.strokeStyle = ol; g.lineWidth = 1.1;
    };
    const wag = Math.sin(t / 260 + c.seed) * 3;

    if (c.state === "sleep") {
      g.fillStyle = col;
      tail(-9, -3, 0, 0);
      g.beginPath(); g.ellipse(0, -6.5, 13, 6.5, 0, 0, 7); g.fill(); g.stroke();
      if (c.patch) { g.fillStyle = c.patch; g.beginPath(); g.ellipse(2, -4, 6, 3, 0, 0, 7); g.fill(); }
      head(8, -8, true);
      g.restore();
      // Zzz
      const z = (t / 900 + c.seed) % 1;
      g.save(); g.globalAlpha = 1 - z; g.fillStyle = "#cfefff"; g.font = `${9 + z * 4}px "Space Grotesk", sans-serif`;
      g.fillText("z", c.x + 8 * c.dir, floor - 18 - z * 14); g.restore();
      return;
    }

    const walking = ["walk", "chase", "hunt", "zoom"].includes(c.state);
    const ph = c.phase;
    if (["sit", "eat", "react", "watch"].includes(c.state) && c.jy === 0) {
      // ngồi: thân nghiêng, đầu cao (khi ăn thì cúi đầu)
      tail(-8, -2, 4, wag);
      g.fillStyle = dk; g.fillRect(4, -9, 3, 9);
      g.fillStyle = col;
      g.save(); g.translate(-2, -9); g.rotate(-.55); g.beginPath(); g.ellipse(0, 0, 10, 7, 0, 0, 7); g.fill(); g.stroke(); g.restore();
      g.fillRect(6, -9, 3.2, 9); g.strokeRect(6, -9, 3.2, 9);
      if (c.state === "eat") head(10 + Math.sin(t / 150) * .6, -9 + Math.abs(Math.sin(t / 200)) * 1.5, false);
      else head(6, -20, c.state === "react" && c.purr);
    } else if (c.state === "scratch") {
      // đứng hai chân sau, hai chân trước cào lên cột
      tail(-6, -4, 10, wag);
      g.fillStyle = col;
      g.save(); g.translate(0, -12); g.rotate(-1.1); g.beginPath(); g.ellipse(0, 0, 12, 6.5, 0, 0, 7); g.fill(); g.stroke(); g.restore();
      g.fillRect(-3, -6, 3.4, 6); g.fillRect(1, -6, 3.4, 6);
      const k = Math.sin(t / 90) * 3;
      g.strokeStyle = col; g.lineWidth = 3;
      g.beginPath(); g.moveTo(4, -18); g.lineTo(11, -24 + k); g.moveTo(4, -15); g.lineTo(11, -19 - k); g.stroke();
      g.strokeStyle = ol; g.lineWidth = 1.1;
      head(5, -27, false);
    } else {
      // đi / chạy
      tail(-12, -11, 12, wag);
      const legs = [[-8, 0, dk], [8, 1.8, dk], [-5, 3.1, col], [10, 4.4, col]];
      for (const [lx, off, lc] of legs) {
        const sw = walking ? Math.sin(ph + off) * 2.6 : 0;
        g.fillStyle = lc; g.beginPath(); g.roundRect(lx - 1.6 + sw, -9, 3.2, 9, 1.4); g.fill();
      }
      g.fillStyle = col; g.beginPath(); g.ellipse(0, -11 + (walking ? Math.abs(Math.sin(ph)) * .8 : 0), 13, 6.5, 0, 0, 7); g.fill(); g.stroke();
      if (c.patch) { g.fillStyle = c.patch; g.beginPath(); g.ellipse(2, -8, 7, 3, 0, 0, 7); g.fill(); }
      if (c.stripes) { g.strokeStyle = c.stripes; g.lineWidth = 1.4; for (const sx of [-6, -1, 4]) { g.beginPath(); g.moveTo(sx, -17); g.lineTo(sx + 1.5, -12); g.stroke(); } g.strokeStyle = ol; g.lineWidth = 1.1; }
      head(12, -17, false);
    }
    g.restore();
  }

  // ---- Đồ vật ----
  function drawItems(t) {
    const { house, post, bowl, bed } = items;
    g.lineJoin = "round"; g.lineWidth = 1.2; g.strokeStyle = "rgba(0,0,0,.4)";
    // Nhà mèo
    const hx = house.x, hy = floor - house.h;
    g.fillStyle = "#c98b5a"; g.fillRect(hx, hy, house.w, house.h); g.strokeRect(hx, hy, house.w, house.h);
    g.fillStyle = "#8d4f2a"; g.beginPath(); g.moveTo(hx - 6, hy + 2); g.lineTo(hx + house.w / 2, hy - 20); g.lineTo(hx + house.w + 6, hy + 2); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = "#3a2416"; g.beginPath(); g.arc(hx + house.w / 2, floor - 12, 11, Math.PI, 0); g.lineTo(hx + house.w / 2 + 11, floor); g.lineTo(hx + house.w / 2 - 11, floor); g.closePath(); g.fill();
    g.fillStyle = "#ffd36b"; g.beginPath(); g.arc(hx + house.w / 2, hy - 6, 3, 0, 7); g.fill();   // đèn tròn trên mái
    // Cột cào móng + đồ chơi treo
    const px = post.x;
    g.fillStyle = "#a9744f"; g.fillRect(px - 15, floor - 5, 38, 5); g.strokeRect(px - 15, floor - 5, 38, 5);
    g.fillStyle = "#d8c08f"; g.fillRect(px, floor - 54, 9, 49); g.strokeRect(px, floor - 54, 9, 49);
    g.strokeStyle = "rgba(120,90,50,.7)"; g.lineWidth = 1;
    for (let y = floor - 52; y < floor - 6; y += 4) { g.beginPath(); g.moveTo(px, y); g.lineTo(px + 9, y + 2); g.stroke(); }
    g.strokeStyle = "rgba(0,0,0,.4)"; g.lineWidth = 1.2;
    g.fillStyle = "#7fb3c9"; g.beginPath(); g.roundRect(px - 12, floor - 61, 33, 8, 3); g.fill(); g.stroke();
    const sw = Math.sin(t / 600) * 6;
    g.strokeStyle = "rgba(255,255,255,.6)"; g.lineWidth = .8; g.beginPath(); g.moveTo(px + 19, floor - 55); g.lineTo(px + 19 + sw, floor - 34); g.stroke();
    g.fillStyle = "#ff8fb1"; g.beginPath(); g.arc(px + 19 + sw, floor - 32, 3.5, 0, 7); g.fill();
    // Bát ăn
    g.fillStyle = "#e05a5a"; g.strokeStyle = "rgba(0,0,0,.4)"; g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(bowl.x - 11, floor - 7); g.lineTo(bowl.x + 11, floor - 7); g.lineTo(bowl.x + 8, floor); g.lineTo(bowl.x - 8, floor); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = "#b9824f"; for (const dx of [-5, -1, 3, 6]) { g.beginPath(); g.arc(bowl.x + dx, floor - 8, 1.8, 0, 7); g.fill(); }
    // Ổ nằm
    g.fillStyle = "#4e5f86"; g.beginPath(); g.ellipse(bed.x, floor - 5, bed.rx, 7, 0, 0, 7); g.fill(); g.stroke();
    g.fillStyle = "#a8b8d8"; g.beginPath(); g.ellipse(bed.x, floor - 6.5, bed.rx - 6, 4, 0, 0, 7); g.fill();
    // Cuộn len
    ball.x += ball.vx; ball.vx *= .985; ball.rot += ball.vx / 6;
    if (ball.x < items.post.x + 30) { ball.x = items.post.x + 30; ball.vx = Math.abs(ball.vx) * .6; }
    if (ball.x > items.bowl.x - 22) { ball.x = items.bowl.x - 22; ball.vx = -Math.abs(ball.vx) * .6; }
    g.save(); g.translate(ball.x, floor - 6); g.rotate(ball.rot);
    g.fillStyle = "#ff7aa8"; g.beginPath(); g.arc(0, 0, 6, 0, 7); g.fill(); g.stroke();
    g.strokeStyle = "#ffd0e0"; g.lineWidth = .9;
    for (const a of [-.6, 0, .6]) { g.beginPath(); g.arc(0, 0, 6, a, a + 2); g.stroke(); }
    g.restore();
    // Chuột đồ chơi
    g.fillStyle = "#9aa3ad"; g.strokeStyle = "rgba(0,0,0,.4)";
    g.beginPath(); g.ellipse(mouse.x, floor - 3.5, 6, 3.5, 0, 0, 7); g.fill(); g.stroke();
    g.fillStyle = "#f3b0c0"; g.beginPath(); g.arc(mouse.x + 3, floor - 7, 1.8, 0, 7); g.fill();
    g.strokeStyle = "#9aa3ad"; g.lineWidth = 1; g.beginPath(); g.moveTo(mouse.x - 6, floor - 3); g.quadraticCurveTo(mouse.x - 12, floor - 8, mouse.x - 15, floor - 2); g.stroke();
  }

  // ---- Hiệu ứng nổi: tim, bong bóng chữ ----
  const pops = [];
  function pop(x, y, kind, text) { pops.push({ x, y, kind, text, life: 1, vx: rand(-.4, .4) }); }
  function drawPops(dt) {
    for (const p of pops) {
      p.life -= dt / 1300; p.y -= dt * .03; p.x += p.vx;
      if (p.life <= 0) continue;
      g.save(); g.globalAlpha = Math.min(1, p.life * 1.5);
      if (p.kind === "heart") {
        g.translate(p.x, p.y); g.scale(.55, .55); g.fillStyle = "#ff5c8a";
        g.beginPath(); g.moveTo(0, 6); g.bezierCurveTo(-14, -4, -6, -14, 0, -6); g.bezierCurveTo(6, -14, 14, -4, 0, 6); g.fill();
      } else {
        g.font = '600 11px "Space Grotesk", sans-serif';
        const tw = g.measureText(p.text).width;
        g.fillStyle = "rgba(255,255,255,.92)";
        g.beginPath(); g.roundRect(p.x - tw / 2 - 6, p.y - 12, tw + 12, 17, 8); g.fill();
        g.beginPath(); g.moveTo(p.x - 3, p.y + 5); g.lineTo(p.x, p.y + 10); g.lineTo(p.x + 3, p.y + 5); g.fill();
        g.fillStyle = "#1b2430"; g.textAlign = "center"; g.fillText(p.text, p.x, p.y + 1);
      }
      g.restore();
    }
    for (let i = pops.length - 1; i >= 0; i--) if (pops[i].life <= 0) pops.splice(i, 1);
  }
  const MEOWS = ["meow~", "nya!", "mrrp?", "prrr...", "meo meo", "♥"];

  // ---- Toạ độ chuột / ngón tay trong thẻ ----
  const local = e => {
    const r = prof.getBoundingClientRect();
    return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
  };
  const hitCat = (x, y) => cats.find(c => c.state !== "hide" && Math.abs(x - c.x) < 20 * c.size &&
    y > floor - c.jy - 32 * c.size && y < floor - c.jy + 4);

  // Chạm vào mèo: nhảy lên, kêu, bắn tim. Chạm liên tục 5 lần → mèo chạy loạn (zoomies)
  prof.addEventListener("pointerdown", e => {
    if (e.target.closest("a, button, .mplayer, .presence")) return;
    const [x, y] = local(e), c = hitCat(x, y);
    if (!c) return;
    const now = performance.now();
    c.taps = c.taps.filter(t => now - t < 2500); c.taps.push(now);
    if (c.state === "sleep") {
      pop(c.x, floor - 34, "text", Math.random() < .5 ? "..." : "zzz?");
      c.state = "react"; c.timer = 1800; c.purr = false; return;
    }
    if (c.taps.length >= 5) {
      c.taps = []; c.state = "zoom"; c.tx = c.x < W / 2 ? W - 40 : 40;
      pop(c.x, floor - 40, "text", "!!!"); return;
    }
    if (c.jy === 0) c.vy = rand(4.5, 6);
    c.state = "react"; c.timer = rand(1800, 2800); c.purr = Math.random() < .5;
    pop(c.x, floor - 40, "text", MEOWS[Math.floor(Math.random() * MEOWS.length)]);
    for (let i = 0; i < 3; i++) setTimeout(() => pop(c.x + rand(-10, 10), floor - 30, "heart"), i * 140);
  });

  // ---- Gậy mèo: bật/tắt bằng nút lông vũ ở góc thẻ ----
  const wand = { on: false, ax: -999, ay: -999, lx: 0, ly: 0, px: 0, py: 0, cool: 0 };
  const wbtn = document.createElement("button");
  wbtn.className = "wand-btn"; wbtn.title = "Gậy mèo (bấm để cầm / thả)";
  wbtn.innerHTML = '<i class="fa-solid fa-feather-pointed"></i>';
  prof.appendChild(wbtn);
  wbtn.onclick = e => {
    e.stopPropagation();
    wand.on = !wand.on;
    wbtn.classList.toggle("on", wand.on);
    document.body.classList.toggle("wand", wand.on);
    if (wand.on) {
      prof.style.transform = "";
      if (TOUCH) { wand.ax = W / 2; wand.ay = floor - 120; wand.lx = wand.px = W / 2; wand.ly = wand.py = floor - 60; }
      else { wand.lx = wand.px = W - 60; wand.ly = wand.py = 60; }
      toast(TOUCH ? "Đã cầm gậy mèo — chạm và kéo trong thẻ để nhử mèo" : "Đã cầm gậy mèo — di chuột trong thẻ để nhử mèo");
    } else {
      cats.forEach(c => { if (c.state === "hunt" || c.state === "watch") choose(c); });
    }
  };
  const TOUCH = matchMedia("(hover: none)").matches;
  prof.addEventListener("pointerdown", e => {
    if (!wand.on || e.target.closest("a, button, .mplayer, .presence")) return;
    [wand.ax, wand.ay] = local(e);
    if (e.pointerType !== "mouse") {
      e.preventDefault();
      try { prof.setPointerCapture(e.pointerId); } catch (_) {}   // kéo ra ngoài thẻ vẫn điều khiển được
    }
  });
  prof.addEventListener("pointermove", e => { if (wand.on) [wand.ax, wand.ay] = local(e); });
  // chuột rời thẻ thì thả gậy; trên cảm ứng nhấc tay ra thì gậy vẫn đứng yên ở chỗ cũ
  prof.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") wand.ax = wand.ay = -999; });

  function stepWand(k) {
    if (!wand.on) return;
    const L = 70, held = wand.ax > -500;
    const vx = (wand.lx - wand.px) * .97, vy = (wand.ly - wand.py) * .97;
    wand.px = wand.lx; wand.py = wand.ly;
    wand.lx += vx; wand.ly += vy + .55 * k;
    if (held) {                                         // dây không dài quá L
      const dx = wand.lx - wand.ax, dy = wand.ly - wand.ay, d = Math.hypot(dx, dy);
      if (d > L) { wand.lx = wand.ax + dx / d * L; wand.ly = wand.ay + dy / d * L; }
    }
    if (wand.ly > floor - 4) { wand.ly = floor - 4; wand.py = wand.ly + (wand.ly - wand.py) * .3; }
    wand.lx = Math.max(6, Math.min(W - 6, wand.lx));
    wand.cool -= k * 16;
  }
  function drawWand(t) {
    if (!wand.on) return;
    const { ax, ay, lx, ly } = wand;
    g.save(); g.lineCap = "round";
    if (ax > -500) {
      g.strokeStyle = "#8a5a3b"; g.lineWidth = 4; g.beginPath(); g.moveTo(ax + 46, ay - 58); g.lineTo(ax, ay); g.stroke();
      g.strokeStyle = "#e3c08d"; g.lineWidth = 1.5; g.beginPath(); g.moveTo(ax + 44, ay - 56); g.lineTo(ax + 2, ay - 2); g.stroke();
      g.strokeStyle = "rgba(255,255,255,.75)"; g.lineWidth = 1;
      g.beginPath(); g.moveTo(ax, ay); g.quadraticCurveTo((ax + lx) / 2, Math.max(ay, ly) + 12, lx, ly); g.stroke();
    }
    const ang = Math.atan2(ly - wand.py, lx - wand.px) * .3 + Math.sin(t / 200) * .25;
    g.translate(lx, ly); g.rotate(ang);
    for (const [col, a] of [["#4fc8ff", -.5], ["#ff7aa8", 0], ["#ffd36b", .5]]) {
      g.save(); g.rotate(a); g.fillStyle = col;
      g.beginPath(); g.ellipse(0, 11, 3.6, 11, 0, 0, 7); g.fill();
      g.strokeStyle = "rgba(255,255,255,.7)"; g.lineWidth = .7; g.beginPath(); g.moveTo(0, 1); g.lineTo(0, 21); g.stroke();
      g.restore();
    }
    g.fillStyle = "#f5c542"; g.beginPath(); g.arc(0, 0, 3.4, 0, 7); g.fill();
    g.fillStyle = "#7a5a10"; g.fillRect(-1, 1.5, 2, 1.5);
    g.restore();
  }
  // Mèo đuổi + nhảy vồ mồi
  function huntAI(c, dt) {
    if (wand.ly < floor - (TOUCH ? 190 : 150)) { c.state = "watch"; c.dir = wand.lx > c.x ? 1 : -1; return; }   // mồi cao quá: ngồi ngóng
    c.state = "hunt";
    const dx = wand.lx - c.x; c.dir = dx > 0 ? 1 : -1;
    if (Math.abs(dx) > 16 && c.jy === 0) { c.x += c.dir * Math.min(Math.abs(dx), c.speed * 2.4 * dt * .05); c.phase += dt * .035; }
    else if (c.jy === 0 && wand.ly > floor - (TOUCH ? 125 : 95) && Math.random() < .08)
      c.vy = Math.min(TOUCH ? 12 : 10, Math.sqrt(2 * .6 * Math.max(10, floor - wand.ly - 8)) + 1);        // nhảy vồ
    const hx = c.x + c.dir * 12 * c.size, hy = floor - c.jy - 18 * c.size;
    if (wand.cool <= 0 && Math.hypot(wand.lx - hx, wand.ly - hy) < (TOUCH ? 22 : 16)) {                     // bắt được!
      wand.cool = 900; wand.py = wand.ly - 9;
      pop(c.x, floor - c.jy - 40, "text", Math.random() < .5 ? "gotcha!" : "nya!!");
      pop(c.x + rand(-8, 8), floor - c.jy - 30, "heart");
    }
  }

  // ---- Vòng lặp ----
  let last = performance.now();
  (function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(50, now - last); last = now;
    if (!document.body.classList.contains("entered")) return;
    const k = dt / 16;
    stepWand(k);
    for (const c of cats) {
      c.timer -= dt;
      if (c.jy > 0 || c.vy > 0) { c.vy -= .6 * k; c.jy += c.vy * k; if (c.jy <= 0) { c.jy = 0; c.vy = 0; } }
      if (wand.on && wand.ax > -500 && !["sleep", "hide", "zoom"].includes(c.state)) { huntAI(c, dt); continue; }
      if (c.state === "hunt" || c.state === "watch") { choose(c); continue; }
      if (c.state === "walk" || c.state === "zoom") {
        const dx = c.tx - c.x, sp = c.state === "zoom" ? 3.2 : 1;
        if (Math.abs(dx) < 3) { if (c.state === "zoom") { c.state = "sit"; c.timer = 2000; } else settle(c); }
        else { c.dir = dx > 0 ? 1 : -1; c.x += c.dir * c.speed * sp * dt * .05; c.phase += dt * .018 * sp; }
      } else if (c.state === "chase") {
        const dx = ball.x - c.x;
        c.dir = dx > 0 ? 1 : -1;
        if (Math.abs(dx) > 14) { c.x += c.dir * c.speed * 1.9 * dt * .05; c.phase += dt * .03; }
        else if (Math.abs(ball.vx) < .3) ball.vx = c.dir * rand(2.5, 4.5);
        if (c.timer <= 0) { c.state = "sit"; c.timer = rand(1500, 3000); }
      } else if (c.timer <= 0) {
        if (c.state === "hide") { c.x = items.house.x + items.house.w / 2; }
        choose(c);
      }
    }
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    drawItems(now);
    cats.forEach(c => drawCat(c, now));
    drawWand(now);
    drawPops(dt);
  })(last);
})();

// ---------- Chuột: con trỏ, vệt sáng, nghiêng ----------
let mx = 0, my = 0, px = innerWidth / 2, py = innerHeight / 2, cxp = px, cyp = py;
const trail = [];
if (hover) {
  addEventListener("mousemove", e => {
    px = e.clientX; py = e.clientY;
    mx = px / innerWidth - .5; my = py / innerHeight - .5;
    $("dot").style.transform = `translate(${px}px, ${py}px)`;
    $(P.bgVideo ? "bg-video" : "bg-image").style.translate = `${mx * -24}px ${my * -14}px`;
    if (P.tilt && !document.body.classList.contains("wand")) $("profile").style.transform = `rotateY(${mx * 16}deg) rotateX(${my * -16}deg)`;
    if (P.cursorTrail) trail.push({ x: px, y: py, life: 1 });
  });
  document.addEventListener("mouseover", e => $("cursor").classList.toggle("big", !!e.target.closest("a, button, #enter, .badges i")));
} else $("cursor").remove(), $("dot").remove();

// ---------- Thành phố (canvas nền) ----------
const cv = $("city"), cx = cv.getContext("2d");
const fv = $("fx"), fx = fv.getContext("2d");
let W, H, dpr, layers = [], stars = [], drops = [], meteors = [];

function build() {
  dpr = LITE ? 1 : Math.min(devicePixelRatio || 1, 2);
  W = cv.width = fv.width = innerWidth * dpr; H = cv.height = fv.height = innerHeight * dpr;
  stars = Array.from({ length: 110 }, () => ({ x: rand(0, W), y: rand(0, H * .5), r: rand(.3, 1.2) * dpr, p: rand(0, 6) }));
  const n = P.weather === "snow" ? 160 : P.weather === "rain" ? (LITE ? 70 : Math.round(innerWidth / 5)) : 0;
  drops = Array.from({ length: n }, () => newDrop(true));
  const cfg = [
    { shade: 34, minH: .18, maxH: .45, minW: 22, maxW: 60, depth: .2, win: .25 },
    { shade: 20, minH: .22, maxH: .62, minW: 34, maxW: 90, depth: .5, win: .35 },
    { shade: 9,  minH: .12, maxH: .40, minW: 60, maxW: 150, depth: 1, win: .45 },
  ];
  layers = cfg.map(c => {
    const bs = []; let x = -80 * dpr;
    while (x < W + 80 * dpr) {
      const w = rand(c.minW, c.maxW) * dpr, h = rand(c.minH, c.maxH) * H;
      const cell = Math.max(5 * dpr, Math.min(14 * dpr, w / rand(7, 12)));
      const wins = [];
      for (let wy = 10 * dpr; wy < h - 8 * dpr; wy += cell * 1.4)
        for (let wx = cell * .6; wx < w - cell * .6; wx += cell)
          if (Math.random() < c.win) wins.push({ x: wx, y: wy, s: cell * .45, b: rand(.35, 1), f: Math.random() < .05 });
      bs.push({ x, w, h, wins, antenna: Math.random() < .2 ? rand(10, 40) * dpr : 0 });
      x += w + rand(-4, 10) * dpr;
    }
    return { ...c, bs };
  });
  prerender();
}
function newDrop(anywhere) {
  const snow = P.weather === "snow", z = rand(.35, 1);
  return {
    x: rand(-W * .1, W * 1.15), y: anywhere ? rand(0, H) : rand(-H * .3, 0), z,
    vy: (snow ? rand(.6, 1.6) : rand(6, 10)) * z * dpr,
    vx: (snow ? rand(-.4, .4) : -1.6 * z) * dpr,
    len: rand(22, 42) * z * dpr, r: rand(1.2, 3) * z * dpr, p: rand(0, 6),
    floor: H * rand(.86, 1),
  };
}
let splashes = [];

// Vẽ sẵn từng lớp nhà ra canvas phụ (chỉ vẽ lại cửa sổ nhấp nháy mỗi khung hình)
const PAD = 90;
function prerender() {
  for (const L of layers) {
    const c = document.createElement("canvas");
    c.width = W + PAD * 2 * dpr; c.height = H + 60 * dpr;
    const g = c.getContext("2d"), o = PAD * dpr;
    L.flick = [];
    for (const b of L.bs) {
      const bx = b.x + o, by = H - b.h;
      g.fillStyle = `rgb(${L.shade},${L.shade},${L.shade})`;
      g.fillRect(bx, by, b.w, b.h + 60 * dpr);
      if (b.antenna) g.fillRect(bx + b.w / 2 - dpr, by - b.antenna, 2 * dpr, b.antenna);
      for (const w of b.wins) {
        const a = w.b * (.35 + L.depth * .5);
        if (w.f) { L.flick.push({ b, w, a }); continue; }
        g.fillStyle = `rgba(235,235,225,${a})`;
        g.fillRect(bx + w.x, by + w.y, w.s, w.s * 1.2);
      }
    }
    L.canvas = c;
  }
}

let flashA = 0;
function lightning() {
  if (!P.lightning) return;
  flashA = .35; setTimeout(() => flashA = .2, 120); setTimeout(() => flashA = .4, 200);
  setTimeout(lightning, rand(9000, 18000));
}
setTimeout(lightning, 5000);

function draw(t) {
  requestAnimationFrame(draw);   // luôn hẹn khung hình tiếp theo trước, để lỗi không làm dừng hiệu ứng
  const drawCity = !$("city").hidden;
  if (drawCity) {
  // Trời
  const sky = cx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#030303"); sky.addColorStop(.6, "#121212"); sky.addColorStop(1, "#1d1d1d");
  cx.fillStyle = sky; cx.fillRect(0, 0, W, H);
  for (const s of stars) {
    cx.globalAlpha = .2 + .6 * Math.abs(Math.sin(t / 1400 + s.p));
    cx.fillStyle = "#fff"; cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 7); cx.fill();
  }
  cx.globalAlpha = 1;

  const haze = cx.createRadialGradient(W / 2, H, 0, W / 2, H, H * .9);
  haze.addColorStop(0, "rgba(255,255,255,.10)"); haze.addColorStop(1, "rgba(255,255,255,0)");
  cx.fillStyle = haze; cx.fillRect(0, 0, W, H);

  for (const L of layers) {
    const ox = mx * -40 * L.depth * dpr, oy = my * -14 * L.depth * dpr;
    cx.drawImage(L.canvas, ox - PAD * dpr, oy);
    for (const { b, w, a } of L.flick) {
      cx.fillStyle = `rgba(235,235,225,${a * (.5 + .5 * Math.sin(t / 250 + w.x))})`;
      cx.fillRect(b.x + ox + w.x, H - b.h + oy + w.y, w.s, w.s * 1.2);
    }
    cx.fillStyle = "rgba(255,255,255,.95)";
    for (const b of L.bs) if (b.antenna && Math.sin(t / 500 + b.x) > .6) {
      cx.beginPath(); cx.arc(b.x + ox + b.w / 2, H - b.h + oy - b.antenna, 1.8 * dpr, 0, 7); cx.fill();
    }
    const fog = cx.createLinearGradient(0, H * .55, 0, H);
    fog.addColorStop(0, "rgba(20,20,20,0)"); fog.addColorStop(1, "rgba(20,20,20,.35)");
    cx.fillStyle = fog; cx.fillRect(0, H * .55, W, H * .45);
  }
  }

  // ---- Lớp hiệu ứng phía trước ----
  fx.clearRect(0, 0, W, H);
  // Sao băng
  if (P.shootingStars && Math.random() < .006 && meteors.length < 2)
    meteors.push({ x: rand(W * .2, W * 1.1), y: rand(0, H * .3), v: rand(10, 16) * dpr, life: 1 });
  for (const m of meteors) {
    m.x -= m.v; m.y += m.v * .45; m.life -= .015;
    const g = fx.createLinearGradient(m.x, m.y, m.x + 120 * dpr, m.y - 54 * dpr);
    g.addColorStop(0, `rgba(255,255,255,${m.life})`); g.addColorStop(1, "rgba(255,255,255,0)");
    fx.strokeStyle = g; fx.lineWidth = 1.6 * dpr;
    fx.beginPath(); fx.moveTo(m.x, m.y); fx.lineTo(m.x + 120 * dpr, m.y - 54 * dpr); fx.stroke();
  }
  meteors = meteors.filter(m => m.life > 0);

  const snow = P.weather === "snow";
  fx.lineCap = "round";
  const rainB = [[], [], []];
  for (const d of drops) {
    d.y += d.vy; d.x += snow ? d.vx + Math.sin(t / 900 + d.p) * .4 * dpr : d.vx;
    if (snow) {
      if (d.y > H + 10) Object.assign(d, newDrop(false));
      fx.fillStyle = `rgba(255,255,255,${.4 + d.z * .5})`;
      fx.beginPath(); fx.arc(d.x, d.y, d.r, 0, 7); fx.fill();
    } else {
      if (d.y > d.floor) {
        if (d.z > .6) for (let k = 0; k < 3; k++)
          splashes.push({ x: d.x, y: d.y, vx: rand(-1.5, 1.5) * dpr, vy: rand(-3, -1.2) * dpr, life: 1 });
        Object.assign(d, newDrop(false));
      }
      rainB[d.z < .55 ? 0 : d.z < .8 ? 1 : 2].push(d);
    }
  }
  // vẽ mưa theo nhóm: mỗi nhóm 1 lần stroke
  [[.32, .75], [.5, 1.1], [.72, 1.5]].forEach(([a, w], i) => {
    if (!rainB[i].length) return;
    fx.strokeStyle = `rgba(235,235,235,${a})`; fx.lineWidth = w * dpr; fx.beginPath();
    for (const d of rainB[i]) { fx.moveTo(d.x - d.vx * 4, d.y - d.len); fx.lineTo(d.x, d.y); }
    fx.stroke();
  });
  // Giọt bắn khi chạm đất
  fx.fillStyle = "rgba(230,230,230,.6)";
  for (const s of splashes) {
    s.x += s.vx; s.y += s.vy; s.vy += .25 * dpr; s.life -= .05;
    fx.globalAlpha = Math.max(s.life, 0);
    fx.fillRect(s.x, s.y, 1.4 * dpr, 1.4 * dpr);
  }
  fx.globalAlpha = 1;
  splashes = splashes.filter(s => s.life > 0);
  // Vệt sáng theo chuột
  for (let i = 0; i < trail.length; i++) {
    const p = trail[i]; p.life -= .045;
    if (p.life <= 0) continue;
    fx.fillStyle = `rgba(255,255,255,${p.life * .7})`;
    fx.shadowColor = "#fff"; fx.shadowBlur = 10 * dpr;
    fx.beginPath(); fx.arc(p.x * dpr, p.y * dpr, p.life * 3.2 * dpr, 0, 7); fx.fill();
  }
  fx.shadowBlur = 0;
  while (trail.length && trail[0].life <= 0) trail.shift();

  // Con trỏ vòng tròn bám theo mượt
  if (hover) {
    cxp += (px - cxp) * .18; cyp += (py - cyp) * .18;
    $("cursor").style.transform = `translate(${cxp}px, ${cyp}px)`;
  }
  // Chớp
  flashA *= .9; $("flash").style.opacity = flashA;
}
build(); addEventListener("resize", build); requestAnimationFrame(draw);
</script>
</body>
</html>
